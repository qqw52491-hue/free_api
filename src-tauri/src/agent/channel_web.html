<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>free_api 远程控制</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#10131a; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#e9ecf3; --muted:#98a1b3; --dim:#6b7484;
  --accent:#5b8cff; --accent2:#7aa5ff; --green:#3ecf8e; --red:#ff6b6b; --amber:#ffb648; --gray:#8b93a5;
  --radius:14px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}

/* ---------- token gate ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.gate-card h1{font-size:20px;margin-bottom:6px}
.gate-card p{color:var(--muted);font-size:13px;margin-bottom:16px}
.gate-card input{width:100%;padding:11px 13px;margin-bottom:12px}
.gate-card .err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;
  background:var(--card2);border:1px solid var(--line);transition:.15s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(11,13,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .titles{flex:1;min-width:0}
.topbar h1{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn:hover{background:var(--card2)}
.only-mobile{display:none}

/* ---------- layout ---------- */
.layout{display:flex;min-height:calc(100vh - 59px)}
.sidebar{width:300px;flex:none;border-right:1px solid var(--line);padding:14px;overflow-y:auto;
  background:var(--bg2);max-height:calc(100vh - 59px);position:sticky;top:59px}
.main{flex:1;min-width:0;padding:18px 18px 120px;max-width:860px;margin:0 auto;width:100%}
.side-group{margin-bottom:10px}
.side-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;width:100%;text-align:left}
.side-head:hover{background:var(--card)}
.side-head .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.side-head .count{color:var(--dim);font-size:12px;flex:none}
.side-head .chev{color:var(--dim);transition:.2s;flex:none}
.side-group.open .side-head .chev{transform:rotate(180deg)}
.side-sessions{margin:2px 0 0 14px;border-left:1px solid var(--line);padding-left:8px;display:none}
.side-group.open .side-sessions{display:block}
.side-task{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-task:hover{background:var(--card)}
.side-task.active{background:var(--card2)}
.side-task .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.side-task .time{font-size:11px;color:var(--dim)}

/* ---------- status chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;flex:none;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.running{color:var(--accent);border-color:rgba(91,140,255,.4);background:rgba(91,140,255,.1)}
.chip.running .cdot{animation:pulse 1.2s infinite}
.chip.waiting{color:var(--amber);border-color:rgba(255,182,72,.4);background:rgba(255,182,72,.1)}
.chip.done{color:var(--green);border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.08)}
.chip.failed{color:var(--red);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.chip.cancelled{color:var(--gray)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- home ---------- */
.hint-card{background:linear-gradient(135deg,rgba(91,140,255,.12),rgba(91,140,255,.04));
  border:1px solid rgba(91,140,255,.25);border-radius:var(--radius);padding:14px 16px;font-size:13.5px;
  color:#c9d4ef;margin-bottom:18px}
.section-title{font-size:15px;font-weight:650;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.section-title .meta{font-size:12px;color:var(--dim);font-weight:400}
.ws-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.ws-head{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;cursor:pointer}
.ws-head:hover{background:rgba(255,255,255,.03)}
.ws-icon{width:38px;height:38px;border-radius:11px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:19px;flex:none}
.ws-info{flex:1;min-width:0}
.ws-name{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ws-path{font-size:12px;color:var(--dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ws-meta{color:var(--muted);font-size:13px;flex:none}
.ws-plus{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  font-size:17px;flex:none;display:flex;align-items:center;justify-content:center}
.ws-plus:hover{border-color:var(--accent);color:var(--accent)}
.ws-chev{color:var(--dim);transition:.2s;flex:none}
.ws-card.open .ws-chev{transform:rotate(180deg)}
.ws-tasks{display:none;border-top:1px solid var(--line);padding:8px}
.ws-card.open .ws-tasks{display:block}
.task-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.task-row:hover{background:var(--card2)}
.task-row .tt{flex:1;min-width:0}
.task-row .title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row .time{font-size:12px;color:var(--dim);margin-top:1px}
.empty-tip{color:var(--dim);font-size:13px;padding:14px;text-align:center}

/* ---------- flow ---------- */
.flow-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.flow-head .back{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.flow-head h2{flex:1;min-width:0;font-size:16.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-pill{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;font-size:14px;margin:10px 0 4px;word-break:break-all}
.goal-pill .arrow{color:var(--muted);flex:none}
.live-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;padding:10px 4px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
.live-line .livedot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
.live-line.wait .livedot{background:var(--amber);animation:none}
.ask-card{background:rgba(255,182,72,.08);border:1px solid rgba(255,182,72,.35);border-radius:var(--radius);
  padding:14px 16px;margin:12px 0}
.ask-card .q{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.ask-card .hint{font-size:12px;color:var(--amber);margin-top:8px}
.result-card{background:rgba(62,207,142,.07);border:1px solid rgba(62,207,142,.3);border-radius:var(--radius);
  padding:14px 16px;margin:12px 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.result-card.fail{background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.35)}
.result-card .rlabel{font-size:12px;color:var(--muted);margin-bottom:6px}

.step{border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
.step .narr{color:var(--muted);font-size:14px;padding:8px 2px 4px;white-space:pre-wrap;word-break:break-word}
.step-row{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:7px 2px;border-radius:9px}
.step-row:hover{background:rgba(255,255,255,.03)}
.step-row .ic{flex:none;font-size:15px;width:22px;text-align:center;margin-top:1px}
.step-row .body{flex:1;min-width:0}
.step-row .act{font-size:14px;word-break:break-word}
.step-row .toolname{color:var(--dim);font-size:12px;font-family:var(--mono);margin-right:6px}
.step-row .right{flex:none;display:flex;align-items:center;gap:8px;margin-top:1px}
.step-row .time{font-size:11.5px;color:var(--dim)}
.step-detail{padding:4px 2px 12px 31px}
.step-detail pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;color:#c4cad6;
  max-height:320px;overflow-y:auto;margin-top:8px}
.step-detail .label{font-size:12px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:5px}
.running-row{display:flex;align-items:center;gap:10px;padding:14px 2px;color:var(--accent);font-size:14px}
.running-row .rdot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.hist-note{color:var(--dim);font-size:12px;padding:8px 2px}

/* ---------- composer ---------- */
.composer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%);z-index:25}
.composer .inner{max-width:828px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer .box{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);
  border-radius:14px;padding:4px 6px 4px 14px}
.composer input{flex:1;border:none;background:none;padding:9px 0;font-size:15px}
.composer input::placeholder{color:var(--dim)}
.send-btn{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;font-size:16px;flex:none;
  display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:.35}
.send-btn.stop{background:rgba(255,107,107,.15);color:var(--red);border:1px solid rgba(255,107,107,.4)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal{align-items:center}}
.modal-card{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px;max-height:86vh;overflow-y:auto}
@media(min-width:640px){.modal-card{border-radius:20px}}
.modal-card h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field select,.field textarea{width:100%;padding:10px 12px}
.field textarea{min-height:96px;resize:vertical}
.field-hint{font-size:12px;color:var(--amber);margin-top:7px;line-height:1.5}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg-btn{flex:1;padding:9px 0;border-radius:8px;color:var(--muted);font-size:14px;text-align:center}
.seg-btn.active{background:var(--accent);color:#fff;font-weight:600}
.att-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.att-chips:empty{display:none}
.chip-file{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:4px 10px;font-size:12.5px;max-width:100%}
.chip-file .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-file .rm{color:var(--dim);font-size:14px;padding:0 2px}
.chip-file .rm:hover{color:var(--red)}
.att-add{display:inline-block;padding:7px 14px;border:1px dashed var(--line2);border-radius:10px;
  color:var(--muted);font-size:13px;cursor:pointer;margin-top:4px}
.att-add:hover{border-color:var(--accent);color:var(--accent)}
#composerFiles{max-width:828px;margin:0 auto 8px;padding:0 0}
#btnClip{width:38px;height:38px;border-radius:11px;flex:none;font-size:16px}
.opts-row{max-width:828px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap;padding:0 2px}
.opt-chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);max-width:48%}
.opt-chip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-chip.set{border-color:rgba(91,140,255,.45);color:var(--accent);background:rgba(91,140,255,.08)}
.sheet-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.sheet-item{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 13px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);width:100%}
.sheet-item:hover{background:var(--card2)}
.sheet-item.active{border-color:var(--accent);background:rgba(91,140,255,.08)}
.sheet-item .si-main{flex:1;min-width:0}
.sheet-item .si-label{font-size:14.5px;font-weight:550}
.sheet-item .si-sub{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-item .si-check{color:var(--accent);font-weight:700}

/* 计划分组（时间线树形） */
.plan-group{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02)}
.plan-head{display:flex;align-items:center;gap:8px;padding:10px 12px;width:100%;text-align:left;background:var(--card);cursor:pointer}
.plan-head:hover{background:var(--card2)}
.plan-head .chev{color:var(--dim);transition:.2s;flex:none}
.plan-group.closed .plan-head .chev{transform:rotate(-90deg)}
.plan-head .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.plan-group.closed .plan-steps{display:none}
.plan-steps{padding:4px 10px 8px}
.step.is-sub{margin-left:16px;border-left:2px solid rgba(91,140,255,.35);padding-left:8px}
.badge-sub{font-size:10.5px;color:var(--accent);border:1px solid rgba(91,140,255,.4);border-radius:5px;padding:0 5px;margin-right:4px;white-space:nowrap}
.field .sel{width:100%;padding:10px 12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

/* ---------- toast ---------- */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;background:rgba(30,34,44,.95);
  border:1px solid var(--line2);color:var(--text);padding:9px 18px;border-radius:12px;font-size:13.5px;
  max-width:80vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}

@media(max-width:879px){
  .only-mobile{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:.22s;
    max-height:none;height:100vh;padding-top:60px;box-shadow:8px 0 40px rgba(0,0,0,.5)}
  .sidebar.show{transform:none}
  .side-mask{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);display:none}
  .side-mask.show{display:block}
  .main{padding:14px 14px 120px}
}
</style>
</head>
<body>

<!-- token gate -->
<div id="gate" class="gate hidden">
  <div class="gate-card">
    <h1>🔐 连接远程控制</h1>
    <p>首次使用需要通道令牌：打开桌面端 <b>微信绑定</b> 页复制 Token（与微信桥共用），或查看
      <span class="mono">~/.config/free-api-chat/channel-config.json</span> 的 <span class="mono">token</span> 字段。</p>
    <input id="gateToken" type="password" placeholder="粘贴通道 Token (X-Channel-Token)" autocomplete="off">
    <div id="gateErr" class="err"></div>
    <button id="gateSave" class="btn primary block">连接</button>
  </div>
</div>

<!-- app -->
<div id="app" class="hidden">
  <header class="topbar">
    <button id="btnMenu" class="icon-btn only-mobile">☰</button>
    <div class="titles">
      <h1 id="topTitle">free_api 远程控制</h1>
      <div class="sub"><span id="connDot" class="dot"></span><span id="connText">连接中…</span></div>
    </div>
    <button id="btnSettings" class="icon-btn" title="通道设置">⚙️</button>
    <button id="btnRefresh" class="icon-btn" title="刷新">⟳</button>
    <button id="btnNew" class="btn primary" style="flex:none">＋ 新任务</button>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sideMask" class="side-mask"></div>
    <main class="main">
      <!-- home -->
      <section id="viewHome">
        <div class="hint-card">💡 这里可以查看桌面端已打开的工作区与任务：选择目录或临时任务发起任务，点进任务实时查看执行流；Agent 提问时在下方输入即可回答。令牌失效请回桌面端重新获取。</div>
        <div class="section-title">当前设备上的工作区和任务 <span class="meta" id="homeMeta"></span></div>
        <div id="wsList"></div>
      </section>

      <!-- flow -->
      <section id="viewFlow" class="hidden">
        <div class="flow-head">
          <button class="back" id="btnBack">←</button>
          <h2 id="flowTitle">任务会话</h2>
          <span id="flowChip" class="chip"></span>
        </div>
        <div class="goal-pill" id="flowGoal"></div>
        <div class="live-line" id="liveLine"></div>
        <div id="timeline"></div>
        <div id="askCard"></div>
        <div id="resultCard"></div>
      </section>
    </main>
  </div>

  <div class="composer" id="composer">
    <div id="composerFiles" class="att-chips"></div>
    <div id="composerOpts" class="opts-row hidden">
      <button class="opt-chip" id="optModel">🤖 跟随会话</button>
      <button class="opt-chip" id="optBudget">🗜 长程</button>
      <button class="opt-chip" id="optRoles">🧭 跟随默认</button>
    </div>
    <div class="inner">
      <button id="btnClip" class="icon-btn hidden" title="添加附件（仅项目对话支持）">📎</button>
      <div class="box">
        <input id="followInput" placeholder="" autocomplete="off">
      </div>
      <button id="btnStop" class="send-btn stop hidden" title="停止任务">■</button>
      <button id="btnSend" class="send-btn" title="发送">➤</button>
    </div>
  </div>
  <input id="clipInput" type="file" multiple class="hidden">

  <!-- 通用选择弹层（模型/压缩模式/角色卡） -->
  <div id="sheetPick" class="modal hidden">
    <div class="modal-card">
      <h3 id="sheetTitle"></h3>
      <div id="sheetList" class="sheet-list"></div>
      <div class="modal-foot"><button class="btn" id="sheetClose">取消</button></div>
    </div>

"use strict";
// ---------------------------------------------------------------- 状态
const S = {

  projects: [],

const BUDGETS = [

];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// ---------------------------------------------------------------- API
function setConn(ok, text) {
  $("connDot").className = "dot " + (ok ? "ok" : "bad");
  $("connText").textContent = text || (ok ? "已连接本机通道" : "连接失败");
}
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", "X-Channel-Token": S.token, ...(opts.headers || {}) },
    });
  } catch (e) {
    setConn(false, "无法连接桌面端（应用未运行？）");
    throw e;
  }
  if (res.status === 401) { showGate("令牌无效或已变更，请重新粘贴"); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  setConn(true);
  return data;
}

// ---------------------------------------------------------------- 工具
function relTime(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return "";
  const diff = (Date.now() - t) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  const d = new Date(t), now = new Date();
  const hm = d.toTimeString().slice(0, 5);
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth() + 1) + "-" + d.getDate() + " " + hm;
}
function short(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "…" : s; }
function toolIcon(tool) {
  const t = String(tool || "").toLowerCase();
  if (/ask|human/.test(t)) return "❓";
  if (/finish|complete|deliver/.test(t)) return "🏁";
  if (/spawn|child|review|writer|worker/.test(t)) return "🤖";
  if (/plan|route|dispatch/.test(t)) return "🧭";
  if (/read|open.*file/.test(t)) return "📖";
  if (/write|edit|apply|patch/.test(t)) return "✍️";
  if (/list|ls|dir|glob|tree/.test(t)) return "📂";
  if (/command|cmd|shell|exec|run/.test(t)) return "💻";
  if (/search|grep|find|retriev|query/.test(t)) return "🔍";
  if (/watch|listen/.test(t)) return "👀";
  if (/artifact|file.*save|upload/.test(t)) return "📦";
  if (/mcp/.test(t)) return "🔌";
  return "⚙️";
}
const STATUS = {
  running:        { cls: "running",  label: "运行中" },
  waiting_human:  { cls: "waiting",  label: "等待回答" },
  succeeded:      { cls: "done",     label: "已完成" },
  done:           { cls: "done",     label: "已完成" },
  failed:         { cls: "failed",   label: "失败" },
  cancelled:      { cls: "cancelled",label: "已取消" },
};
function renderStep(st) {
  const open = S.expandedSteps.has(String(st.id));
  const act = (st.action && st.action !== st.tool) ? st.action : (st.description || st.action || "");
  const desc = st.description && st.description !== act ? `<div class="narr">${esc(st.description)}</div>` : "";
  const thought = st.thought ? `<div class="label">🧠 思考</div><pre>${esc(st.thought)}</pre>` : "";
  const params = st.command || st.params;
  const paramsHtml = params ? `<div class="label">⌨️ 参数</div><pre>${esc(typeof params === "string" ? params : JSON.stringify(params, null, 2))}</pre>` : "";
  const output = st.output ? `<div class="label">📄 输出</div><pre>${esc(st.output)}</pre>` : "";
  const isSub = /spawn|child|review|writer|worker/.test(String(st.tool || "").toLowerCase());
  return `<div class="step ${isSub ? "is-sub" : ""}">
    ${desc}
    <button class="step-row" data-step="${esc(st.id)}">
      <span class="ic">${toolIcon(st.tool)}</span>
      <span class="body"><span class="toolname">${esc(st.tool || "工具")}</span>${isSub ? `<span class="badge-sub">🤖 子智能体</span>` : ""}<span class="act">${esc(act)}</span></span>
      <span class="right">${st.timestamp ? `<span class="time">${esc(relTime(new Date(st.timestamp).toISOString()))}</span>` : ""}${stepChip(st.status)}</span>
    </button>
    ${open ? `<div class="step-detail">${thought}${paramsHtml}${output}</div>` : ""}
  </div>`;
}
function chip(status, extra) {
  const meta = STATUS[status] || { cls: "", label: status ? status : "无任务" };
  return `<span class="chip ${meta.cls}">${extra || ""}<span class="cdot"></span>${esc(meta.label)}</span>`;
}
function stepChip(status) {
  const map = { succeeded: ["done", "✓"], failed: ["failed", "✗"], finish_challenged: ["waiting", "挑战"], running: ["running", ""] };
  const [cls, label] = map[status] || ["", status || ""];
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}
function toast(msg, ms = 2600) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function modelName(id) {
  const m = S.modelById[id];
  return m ? (m.display_name || m.name) : short(id, 14);
}
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.ceil(n / 1024) + "KB"; }
function renderFileChips(container, files, onRemove) {
  container.innerHTML = files.map((f, i) =>

  container.querySelectorAll(".rm").forEach((btn, idx) => { btn.onclick = () => onRemove(idx); });
}
async function uploadFile(sessionId, file) {

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

// ---------------------------------------------------------------- 门禁
function showGate(errText) {
  $("gateErr").textContent = errText || "";

}
async function tryConnect(token) {

// ---------------------------------------------------------------- 数据加载

// ---------------------------------------------------------------- 任务选项（composer 小按钮）
function resetTaskOpts() {

function updateOptChips() {

function openSheet(title, items, currentValue, onPick) {

  $("optBudget").onclick = () => openSheet("上下文压缩模式", BUDGETS, S.taskOpts.context_budget_mode,

// ---------------------------------------------------------------- 设置抽屉
async function openSettings() {
  try {

    $("setDefault").innerHTML = `<option value="">（未设置）</option>` + S.models.map(m =>
      `<option value="${esc(m.id)}" ${m.id === cfg.model_id ? "selected" : ""}>${esc(m.display_name || m.name)} · ${esc(m.platform_name || "")}</option>`).join("");
    $("setRetries").value = cfg.llm_retries ?? 3;

async function saveSettings() {
  try {
    await api("/channel/config", {
      method: "PUT",
      body: JSON.stringify({
        model_id: $("setDefault").value || null,
        llm_retries: Math.max(1, Math.min(100, parseInt($("setRetries").value || "3", 10))),

        phase_pushes: $("setPhase").value === "1",

    toast("设置已保存");
  } catch (e) { toast("保存失败：" + e.message); }

// ---------------------------------------------------------------- SSE 实时推送
// 服务端把 run 的进度/状态/终态经 broadcast 总线下发（比 WebSocket 更贴合本机 HTTP +
// 隧道穿透场景）；EventSource 断线自动重连。收到事件 → 立即拉取对应数据渲染。
function connectSSE(force) {
  if (!window.EventSource) return;
  // 已在连接/打开状态且非强制 → 不动（EventSource 自带断线重连）
  if (S.es && S.es.readyState <= 1 && !force) return;
  if (S.es) { try { S.es.close(); } catch (e) {} S.es = null; }
  try {
    const es = new EventSource(`/channel/events?token=${encodeURIComponent(S.token)}`);
    S.es = es;
    S.sseFails = 0;
    es.onopen = () => { S.sseFails = 0; };
    let lastHomeRefresh = 0;
    let flowPending = false;
    const scheduleFlowRefresh = () => {
      if (flowPending) return;
      flowPending = true;
      setTimeout(() => {
        flowPending = false;
        if (S.view.name === "flow" && S.currentSessionId) loadFlow(S.currentSessionId).catch(() => {});
      }, 1000);
    };
    es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (S.view.name === "flow" && msg.session_id === S.currentSessionId) {
          scheduleFlowRefresh();
        } else if (S.view.name === "home") {
          const now = Date.now();
          if (now - lastHomeRefresh > 2000) { lastHomeRefresh = now; loadHome().catch(() => {}); }
        }
      } catch (err) { /* 忽略坏帧 */ }
    };
    es.onerror = () => {
      S.sseFails = (S.sseFails || 0) + 1;
      if (S.sseFails >= 6) {
        // 连续失败（服务器下线/令牌失效）：停掉重连循环，校验令牌后重建
        try { es.close(); } catch (err) {}
        S.es = null;
        api("/channel/config")
          .then(() => { setTimeout(() => connectSSE(true), 2000); })
          .catch(() => {});
      }
      // 其余情况交给 EventSource 内建自动重连
    };
  } catch (e) { S.es = null; }
}

// 后台切回 / 断网恢复：立即拉最新数据 + 确保 SSE 存活
function resumeLive() {
  connectSSE();
  if (S.view.name === "flow" && S.currentSessionId) loadFlow(S.currentSessionId).catch(() => {});
  else if (S.token) loadHome().catch(() => {});
}
async function loadHome() {
  const [projRes, sessRes] = await Promise.all([
    api("/channel/projects"),
    api("/channel/sessions"),
  ]);
  S.projects = projRes.projects || [];
  S.sessions = sessRes.sessions || [];
  renderHome(); renderSidebar();
}
async function loadFlow(sessionId) {
  const [sessRes, runsRes, tracesRes] = await Promise.all([
    api("/channel/sessions"),
    api("/channel/runs"),
    api(`/channel/session/${encodeURIComponent(sessionId)}/traces`),
  ]);
  S.sessions = sessRes.sessions || [];
  const session = S.sessions.find(s => s.id === sessionId) || null;
  const run = (runsRes.runs || []).filter(r => r.session_id === sessionId)
    .sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""))[0] || null;
  const traces = tracesRes.traces || [];
  const latest = traces.length ? traces[traces.length - 1] : null;
  const stamp = latest ? `${latest.id}:${latest.step_count}:${latest.updated_at}` : "";
  let trace = S.flow && S.flow.sessionId === sessionId ? S.flow.trace : null;
  if (latest && (stamp !== S.lastTraceStamp || !trace)) {
    const detail = await api(`/channel/trace/${encodeURIComponent(latest.id)}`);
    trace = detail.trace;
  }
  S.lastTraceStamp = stamp;
  S.flow = { sessionId, session, run, trace, traces };
  renderFlow();
}

// ---------------------------------------------------------------- 渲染：home / sidebar
function groupsOf() {
  const groups = [];
  const scratchSessions = S.sessions.filter(s => !s.project_id);
  groups.push({ key: "__scratch__", icon: "💬", name: "临时任务", sub: "未绑定项目 · 使用临时工作区", sessions: scratchSessions });
  for (const p of S.projects) {
    groups.push({ key: p.id, icon: "📁", name: p.name, sub: p.root_path, tag: "本地",
      sessions: S.sessions.filter(s => s.project_id === p.id) });
  }
  return groups;
}
const MAX_ROWS = 15;
function limitedRows(sessions, compact) {
  const view = sessions.length <= MAX_ROWS ? sessions : sessions.slice(0, MAX_ROWS);
  return { html: view.map(s => taskRow(s, compact)).join(""), rest: sessions.length - view.length };
}
function taskRow(s, compact) {
  const title = esc(s.goal || s.title);
  const time = `${esc(relTime(s.trace_updated_at || s.updated_at))}`;
  if (compact) {
    return `<button class="side-task ${S.currentSessionId === s.id ? "active" : ""}" data-session="${esc(s.id)}">
      <div class="t"><span>${esc(short(s.goal || s.title, 26))}</span></div>
      <div class="time">${time}</div>
    </button>`;
  }
  return `<button class="task-row" data-session="${esc(s.id)}">
    <div class="tt">
      <div class="title">${title}</div>
      <div class="time">${time} · ${esc(modelName(s.model_id))}</div>
    </div>
    ${chip(s.status)}
  </button>`;
}
function renderHome() {
  // 数据没变化就跳过重渲染，避免轮询打断用户点击/滚动
  const signature = JSON.stringify([S.projects, S.sessions, [...S.openGroups], S.currentSessionId]);
  if (signature === S._homeSig) { renderSidebar(); return; }
  S._homeSig = signature;
  $("homeMeta").textContent = `${S.projects.length + 1} 个工作区 · ${S.sessions.length} 个任务`;
  const groups = groupsOf();
  $("wsList").innerHTML = groups.map(g => {
    const open = S.openGroups.has(g.key);
    const rows = limitedRows(g.sessions);
    const tasks = g.sessions.length
      ? rows.html + (rows.rest ? `<div class="empty-tip">还有 ${rows.rest} 个更早的任务未显示（最近 ${MAX_ROWS} 个）</div>` : "")
      : `<div class="empty-tip">还没有任务，点右上 ＋ 发起</div>`;
    return `<div class="ws-card ${open ? "open" : ""}" data-group="${esc(g.key)}">
      <div class="ws-head" role="button" tabindex="0" data-toggle="${esc(g.key)}">
        <div class="ws-icon">${g.icon}</div>
        <div class="ws-info">
          <div class="ws-name">${esc(g.name)} ${g.tag ? `<span class="tag">${g.tag}</span>` : ""}</div>
          <div class="ws-path">${esc(g.sub || "")}</div>
        </div>
        <div class="ws-meta">${g.sessions.length} 个任务</div>
        <button class="ws-plus" data-new="${esc(g.key)}" title="在此工作区发起新任务">＋</button>
        <span class="ws-chev">⌄</span>
      </div>
      <div class="ws-tasks">${tasks}</div>
    </div>`;
  }).join("");
}
function renderSidebar() {
  const groups = groupsOf();
  const sig = JSON.stringify([groups, [...S.openGroups], S.currentSessionId]);
  if (sig === S._sideSig) return;
  S._sideSig = sig;
  $("sidebar").innerHTML = `<div style="padding:4px 8px 12px">
      <button class="btn primary block" data-new="__scratch__">🚀 在临时工作区发任务</button>
    </div>` + groups.map(g => {
    const open = S.openGroups.has(g.key);
    const rows = limitedRows(g.sessions, true);
    const items = rows.html + (rows.rest ? `<div class="empty-tip">仅显示最近 ${MAX_ROWS} 个</div>` : "");
    return `<div class="side-group ${open ? "open" : ""}" data-sgroup="${esc(g.key)}">
      <button class="side-head" data-toggle="${esc(g.key)}">
        <span>${g.icon}</span><span class="name">${esc(g.name)}</span>
        <span class="count">${g.sessions.length}</span><span class="chev">⌄</span>
      </button>
      <div class="side-sessions">${items || `<div class="empty-tip">无任务</div>`}</div>
    </div>`;
  }).join("");
}
function toggleGroup(key) {
  if (S.openGroups.has(key)) S.openGroups.delete(key); else S.openGroups.add(key);
  localStorage.setItem("free_api_open_groups", JSON.stringify([...S.openGroups]));
  renderHome(); renderSidebar();
}

// ---------------------------------------------------------------- 渲染：flow
function renderFlow() {
  const f = S.flow;
  if (!f) return;
  const s = f.session || {};
  const active = f.run && ["running", "waiting_human"].includes(f.run.status);
  const status = active ? f.run.status : (f.trace ? f.trace.status : (s.status || null));
  $("flowTitle").textContent = short(s.goal || f.trace?.goal || s.title || "任务会话", 30);
  $("flowChip").outerHTML = chip(status).replace('class="chip', `id="flowChip" class="chip`);
  const wsName = s.project_name ? `${s.project_name}` : "临时工作区";
  const startedAt = f.trace?.started_at || s.trace_started_at;
  $("flowGoal").innerHTML = `<span class="arrow">→</span><span>${esc(s.goal || f.trace?.goal || s.title || "")}</span>`;

  // 实时状态行
  const live = $("liveLine");
  if (f.run && f.run.status === "running") {
    live.className = "live-line";
    live.innerHTML = `<span class="livedot"></span>工作中 <span style="color:var(--dim)">· ${esc(f.run.state_detail || f.run.phase || "执行中")}${f.run.event_count ? ` · ${f.run.event_count} 个事件` : ""}</span>`;
  } else if (f.run && f.run.status === "waiting_human") {
    live.className = "live-line wait";
    live.innerHTML = `<span class="livedot"></span><span style="color:var(--amber)">等待你的回答</span>`;
  } else {
    live.className = "live-line";
    live.innerHTML = `<span style="color:var(--dim)">${esc(wsName)} · ${esc(modelName(s.model_id))}${startedAt ? ` · 开始于 ${esc(relTime(startedAt))}` : ""}${f.trace ? ` · ${f.trace.step_count ?? (f.trace.steps || []).length} 步` : ""}</span>`;
  }

  // 提问卡片
  const paused = f.run && f.run.status === "waiting_human" ? (f.run.paused_reason || "Agent 请求人工协助。") : null;
  $("askCard").innerHTML = paused
    ? `<div class="ask-card"><div class="rlabel" style="color:var(--amber)">❓ Agent 提问</div><div class="q">${esc(paused)}</div><div class="hint">在底部输入框直接回复即为答案</div></div>`
    : "";

  // 结果卡片
  const failed = status === "failed";
  const resultText = (f.run && f.run.error) ? f.run.error
    : (f.run && f.run.result) ? f.run.result
    : (f.trace && f.trace.completion && f.trace.completion.summary) ? f.trace.completion.summary : null;
  $("resultCard").innerHTML = (!active && resultText)
    ? `<div class="result-card ${failed ? "fail" : ""}"><div class="rlabel">${failed ? "✗ 失败原因" : "✓ 执行结果"}</div>${esc(resultText)}</div>`
    : "";

  // 时间线：步骤按所属计划分组（plan_id），组可折叠；子代理步骤带分支徽标
  const steps = (f.trace && f.trace.steps) || [];
  const groups = [];
  const byPlan = new Map();
  steps.forEach((st) => {
    const key = st.plan_id || "_none";
    if (!byPlan.has(key)) {
      byPlan.set(key, { key, title: st.plan_title || "执行过程", steps: [] });
      groups.push(byPlan.get(key));
    }
    const g = byPlan.get(key);
    if (!g.title && st.plan_title) g.title = st.plan_title;
    g.steps.push(st);
  });
  const groupStatus = (g) => {
    const failed = g.steps.filter(s => s.status === "failed").length;
    if (failed) return { cls: "failed", text: `${failed} 失败` };
    const challenged = g.steps.some(s => s.status === "finish_challenged");
    if (challenged) return { cls: "waiting", text: "待确认" };
    return { cls: "done", text: `${g.steps.length} 步` };
  };
  const planParts = groups.map((g) => {
    const closed = S.collapsedPlans.has(g.key);
    const stat = groupStatus(g);
    const rows = g.steps.map((st) => renderStep(st)).join("");
    return `<div class="plan-group ${closed ? "closed" : ""}" data-plan="${esc(g.key)}">
      <button class="plan-head" data-ptoggle="${esc(g.key)}">
        <span class="chev">⌄</span>
        <span class="pt">📋 ${esc(g.title)}</span>
        <span class="chip ${stat.cls}">${esc(stat.text)}</span>
      </button>
      <div class="plan-steps">${rows}</div>
    </div>`;
  }).join("");
  const parts = [];
  if (!f.trace) parts.push(`<div class="empty-tip">该会话还没有执行记录${active ? "，正在等待第一步完成…" : ""}</div>`);
  parts.push(planParts);
  if (f.run && f.run.status === "running") {
    parts.push(`<div class="running-row"><span class="rdot"></span>${esc(f.run.state_detail || "正在执行下一步…")}</div>`);
  }
  if (f.traces && f.traces.length > 1) {
    parts.push(`<div class="hist-note">🕘 本会话共 ${f.traces.length} 次任务，当前显示最近一次</div>`);
  }
  $("timeline").innerHTML = parts.join("");

  // composer 语境
  const input = $("followInput");
  $("btnStop").classList.toggle("hidden", !(f.run && f.run.status === "running"));
  // 附件只在「项目会话 + 终态（要发新任务）」时可用
  const canAttach = !!s.project_id && !(f.run && ["running", "waiting_human"].includes(f.run.status));
  $("btnClip").classList.toggle("hidden", !canAttach);
  if (!canAttach && S.composerFiles.length) { S.composerFiles = []; refreshComposerFiles(); }
  // 任务选项（模型/压缩/角色）只在终态（要发新任务）时出现
  const optsOn = !(f.run && ["running", "waiting_human"].includes(f.run.status));
  $("composerOpts").classList.toggle("hidden", !optsOn);
  updateOptChips();
  if (f.run && f.run.status === "waiting_human") {
    input.placeholder = "回复 Agent 的提问…";
  } else if (f.run && f.run.status === "running") {
    input.placeholder = "接管方向：输入新指令（ReplaceGoal）…";
  } else {
    input.placeholder = "在当前会话发起下一个任务…";
  }
  renderSidebar();
}

// ---------------------------------------------------------------- 动作
async function openSession(sessionId) {
  S.currentSessionId = sessionId;
  S.view = { name: "flow" };
  resetTaskOpts();
  $("viewHome").classList.add("hidden");
  $("viewFlow").classList.remove("hidden");
  closeSidebarMobile();
  S.lastTraceStamp = "";
  renderFlowLoading();
  try { await loadFlow(sessionId); } catch (e) { toast("加载失败：" + e.message); }
}
function renderFlowLoading() {
  $("timeline").innerHTML = `<div class="empty-tip">加载中…</div>`;
}
function goHome() {
  S.currentSessionId = null;
  S.view = { name: "home" };
  $("viewFlow").classList.add("hidden");
  $("viewHome").classList.remove("hidden");
  renderHome(); renderSidebar();
  loadHome().catch(() => {});
}
async function sendComposer() {
  const input = $("followInput");
  const text = input.value.trim();
  if (!text || !S.flow) return;
  const f = S.flow;
  try {
    if (f.run && f.run.status === "waiting_human") {
      await api(`/channel/run/${f.run.run_id}/answer`, { method: "POST", body: JSON.stringify({ text }) });
      toast("已回答，Agent 继续执行");
    } else if (f.run && f.run.status === "running") {
      await api(`/channel/run/${f.run.run_id}/goal`, { method: "POST", body: JSON.stringify({ goal: text }) });
      toast("已接管方向（ReplaceGoal）");
    } else {
      for (let i = 0; i < S.composerFiles.length; i++) {
        toast(`上传附件 ${i + 1}/${S.composerFiles.length}…`, 1500);
        await uploadFile(f.sessionId, S.composerFiles[i]);
      }
      S.composerFiles = []; refreshComposerFiles();
      // 本次任务的路由覆盖（模型全槽 / 压缩模式 / 角色卡按作用域钉死）
      const routing = {};
      if (S.taskOpts.model_id) { routing.pro = routing.flash = routing.vision = S.taskOpts.model_id; }
      if (S.taskOpts.context_budget_mode) routing.context_budget_mode = S.taskOpts.context_budget_mode;
      const card = S.roleCards.find(c => c.name === S.taskOpts.role_card);
      if (card) {
        const rm = {};
        String(card.scope_hints || "").split(",").forEach((scope) => {
          const key = scope.trim();
          if (key) rm[key] = card.model_id;
        });
        if (Object.keys(rm).length) routing.role_models = rm;
      }
      const body = { session_id: f.sessionId, goal: text };
      if (Object.keys(routing).length) body.model_routing = routing;
      await api("/channel/task", { method: "POST", body: JSON.stringify(body) });
      resetTaskOpts();
      toast("新任务已启动");
      S.lastTraceStamp = "";
    }
    input.value = "";
    await loadFlow(f.sessionId);
  } catch (e) { toast("操作失败：" + e.message); }
}
async function stopRun() {
  const f = S.flow;
  if (!f || !f.run) return;
  try {
    await api(`/channel/run/${f.run.run_id}/cancel`, { method: "POST" });
    toast("已请求停止");
    await loadFlow(f.sessionId);
  } catch (e) { toast("停止失败：" + e.message); }
}
let newTaskType = "scratch";
function refreshModalFiles() {
  renderFileChips($("attChips"), S.pendingFiles, (i) => { S.pendingFiles.splice(i, 1); refreshModalFiles(); });
}
function refreshComposerFiles() {
  renderFileChips($("composerFiles"), S.composerFiles, (i) => { S.composerFiles.splice(i, 1); refreshComposerFiles(); });
}
function syncSeg() {
  $("typeScratch").classList.toggle("active", newTaskType === "scratch");
  $("typeProject").classList.toggle("active", newTaskType === "project");
  $("projField").style.display = newTaskType === "project" ? "" : "none";
  $("attField").style.display = newTaskType === "project" ? "" : "none";
  if (newTaskType !== "project") { S.pendingFiles = []; refreshModalFiles(); }
}
function openModal(prefillProjectId) {
  newTaskType = prefillProjectId && prefillProjectId !== "__scratch__" ? "project" : "scratch";
  const projects = groupsOf().filter(g => g.key !== "__scratch__");
  $("newProj").innerHTML = projects.map(g =>
    `<option value="${esc(g.key)}" ${g.key === prefillProjectId ? "selected" : ""}>${g.icon} ${esc(g.name)}</option>`).join("")
    || `<option value="">（暂无项目）</option>`;
  $("projHint").textContent = projects.length ? "" : "还没有项目：先在桌面端左侧项目树「新建项目」（填目录），保存后回到这里就能选。";
  syncSeg();
  const msel = $("newModel");
  msel.innerHTML = S.models.map(m =>
    `<option value="${esc(m.id)}">${esc(m.display_name || m.name)} · ${esc(m.platform_name || "")}</option>`).join("")
    || `<option value="">（无可用模型，请在桌面端配置）</option>`;
  $("newGoal").value = "";
  $("modalNew").classList.remove("hidden");
  $("newGoal").focus();
}
async function submitNew() {
  const projectId = newTaskType === "project" ? $("newProj").value : null;
  if (newTaskType === "project" && !projectId) { toast("还没有可选项目，请先在桌面端新建项目"); return; }
  const modelId = $("newModel").value;
  const goal = $("newGoal").value.trim();
  if (!goal) { toast("请填写任务内容"); return; }
  if (!modelId) { toast("没有可用模型"); return; }
  const btn = $("newSubmit");
  btn.disabled = true;
  let sess;
  try {
    sess = await api("/channel/session", {
      method: "POST",
      body: JSON.stringify({
        project_id: projectId,
        title: short(goal.replace(/\s+/g, " "), 28),
        model_id: modelId,
      }),
    });
  } catch (e) { toast("创建会话失败：" + e.message); btn.disabled = false; return; }
  // 附件先行上传（仅项目对话）；失败则跳到会话页用 📎 重试，任务不启动
  try {
    const total = S.pendingFiles.length;
    for (let i = 0; i < total; i++) {
      btn.textContent = `上传附件 ${i + 1}/${total}…`;
      await uploadFile(sess.session_id, S.pendingFiles[i]);
    }
  } catch (e) {
    S.pendingFiles = []; refreshModalFiles();
    btn.disabled = false; btn.textContent = "启动";
    $("modalNew").classList.add("hidden");
    await loadHome().catch(() => {});
    await openSession(sess.session_id);
    toast("附件上传失败：" + e.message + "（会话已创建，可点 📎 重新添加后发送即启动任务）", 4000);
    return;
  }
  S.pendingFiles = []; refreshModalFiles();
  btn.textContent = "启动";
  $("modalNew").classList.add("hidden");
  try {
    await loadHome().catch(() => {});
    await openSession(sess.session_id);
    await api("/channel/task", { method: "POST", body: JSON.stringify({ session_id: sess.session_id, goal }) });
    toast("任务已启动");
    await loadFlow(sess.session_id);
  } catch (e) {
    toast("启动失败：" + e.message);
  } finally { btn.disabled = false; }
}

// ---------------------------------------------------------------- 轮询
function pollTick() {
  if (document.hidden) return;
  S.tick++;
  const sseOpen = S.es && S.es.readyState === 1;
  // 看门狗：SSE 已死（CLOSED）时定期重建
  if (S.tick % 8 === 0 && S.es && S.es.readyState === 2) connectSSE(true);
  if (S.view.name === "flow" && S.currentSessionId) {
    // SSE 已连接时事件驱动刷新，轮询降级为安全网
    if (!sseOpen || S.tick % 4 === 0) loadFlow(S.currentSessionId).catch(() => {});
  } else if (S.view.name === "home" && (S.tick % 4 === 0 || (sseOpen && S.tick % 12 === 0))) {
    loadHome().catch(() => {});
  }
}
function stopPolling() {
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
}
function startPolling() {
  stopPolling();
  S.pollTimer = setInterval(pollTick, 2500);
}

// ---------------------------------------------------------------- 移动端侧栏
function closeSidebarMobile() {
  $("sidebar").classList.remove("show");
  $("sideMask").classList.remove("show");
}

// ---------------------------------------------------------------- 事件绑定
function bind() {
  $("gateSave").onclick = async () => {
    const token = $("gateToken").value.trim();
    if (!token) { $("gateErr").textContent = "请粘贴 Token"; return; }
    $("gateSave").disabled = true;
    await tryConnect(token);
    $("gateSave").disabled = false;
  };
  $("gateToken").addEventListener("keydown", (e) => { if (e.key === "Enter") $("gateSave").click(); });

  $("btnMenu").onclick = () => { $("sidebar").classList.toggle("show"); $("sideMask").classList.toggle("show"); };
  $("sideMask").onclick = closeSidebarMobile;
  $("btnBack").onclick = goHome;
  $("btnRefresh").onclick = () => {
    if (S.view.name === "flow" && S.currentSessionId) loadFlow(S.currentSessionId).catch(e => toast(e.message));
    else loadHome().catch(() => {});
  };
  $("btnNew").onclick = () => openModal("__scratch__");
  $("btnSettings").onclick = openSettings;
  $("setCancel").onclick = () => $("modalSettings").classList.add("hidden");
  $("modalSettings").addEventListener("click", (e) => { if (e.target === $("modalSettings")) $("modalSettings").classList.add("hidden"); });
  $("setSave").onclick = saveSettings;
  bindOptChips();
  $("typeScratch").onclick = () => { newTaskType = "scratch"; syncSeg(); };
  $("typeProject").onclick = () => { newTaskType = "project"; syncSeg(); };
  $("newCancel").onclick = () => $("modalNew").classList.add("hidden");
  $("modalNew").addEventListener("click", (e) => { if (e.target === $("modalNew")) $("modalNew").classList.add("hidden"); });
  $("newSubmit").onclick = submitNew;

  $("btnSend").onclick = sendComposer;
  $("btnClip").onclick = () => $("clipInput").click();
  $("clipInput").addEventListener("change", (e) => {
    S.composerFiles.push(...e.target.files);
    e.target.value = "";
    refreshComposerFiles();
  });
  $("attInput").addEventListener("change", (e) => {
    S.pendingFiles.push(...e.target.files);
    e.target.value = "";
    refreshModalFiles();
  });
  $("followInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) sendComposer(); });
  $("btnStop").onclick = stopRun;

  // 委托点击：工作区折叠 / 任务行 / 步骤展开 / 侧栏任务
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const head = e.target.closest?.('[data-toggle][role="button"]');
    if (head) { e.preventDefault(); toggleGroup(head.dataset.toggle); }
  });
  document.addEventListener("click", (e) => {
    // ＋ 按钮在卡片头内部，必须先于折叠判断，否则会被当作展开/收起
    const plus = e.target.closest("[data-new]");
    if (plus) { e.stopPropagation(); openModal(plus.dataset.new); closeSidebarMobile(); return; }
    const ptog = e.target.closest("[data-ptoggle]");
    if (ptog) {
      const k = ptog.dataset.ptoggle;
      if (S.collapsedPlans.has(k)) S.collapsedPlans.delete(k); else S.collapsedPlans.add(k);
      renderFlow();
      return;
    }
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) { toggleGroup(toggle.dataset.toggle); return; }
    const sessionBtn = e.target.closest("[data-session]");
    if (sessionBtn) { openSession(sessionBtn.dataset.session); return; }
    const stepBtn = e.target.closest("[data-step]");
    if (stepBtn) {
      const id = stepBtn.dataset.step;
      if (S.expandedSteps.has(id)) S.expandedSteps.delete(id); else S.expandedSteps.add(id);
      renderFlow();
    }
  });
}

// ---------------------------------------------------------------- 启动
async function boot() {
  bind();
  await loadModels().catch(() => {});
  try {
    await loadHome();
    setConn(true);
  } catch (e) {
    setConn(false, "加载失败：" + e.message);
  }
  startPolling();
  connectSSE();
  // 深链：?session=<id> 直达任务会话（微信推送点进来就是对应任务）
  const deepSession = new URL(location.href).searchParams.get("session");
  if (deepSession) {
    history.replaceState(null, "", location.pathname);
    openSession(deepSession).catch(() => {});
  }
  // 后台切回 / 网络恢复：立即恢复连接并拉最新数据
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") resumeLive();
  });
  window.addEventListener("online", () => { connectSSE(true); resumeLive(); });
}

(function init() {
  const url = new URL(location.href);
  const urlToken = url.searchParams.get("token");
  if (urlToken) {
    url.searchParams.delete("token");
    history.replaceState(null, "", url.pathname + (url.searchParams.toString() ? "?" + url.searchParams : ""));
    localStorage.setItem("free_api_web_token", urlToken);
    S.token = urlToken;
  }
  if (S.token) {
    tryConnect(S.token).then((ok) => { if (!ok && $("gateErr").textContent === "") showGate(); });
  } else {
    showGate();
  }
})();
</script>
