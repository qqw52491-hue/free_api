[package]
name = "free-api-chat"
version = "0.1.0"
description = "Free API AI Chat - High Performance Tauri App"
authors = ["wx"]
edition = "2021"
default-run = "free-api-chat"


[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
base64 = "0.22"
anyhow = "1"
dirs-next = "2"
serde_yaml = "0.9"
futures = "0.3"
sysinfo = "0.38.4"
sha2 = "0.10"

# 仅 `cargo build --features wdio` 的测试构建载入；正常开发与发布版均不包含 WebDriver。
[features]
wdio = ["dep:tauri-plugin-wdio-webdriver"]
